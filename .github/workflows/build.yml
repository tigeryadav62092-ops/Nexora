name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q project-bolt-sb1-rpedyp12.zip -d extracted

      - name: Find project
        run: |
          PACKAGE_JSON=$(find extracted -name package.json -print -quit)
          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found inside ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build web app
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Install Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/cli @capacitor/core @capacitor/android
      - name: Create Capacitor config
            - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android 
             - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android
        run: |
          cd "$PROJECT_DIR"
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexora.app",
            "appName": "Nexora",
            "webDir": "dist"
          }
          EOF
         
            - name: Initialize Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap init Nexora com.nexora.app --web-dir dist --skip-config
      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: |
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
